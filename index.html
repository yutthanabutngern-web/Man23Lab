:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F4F6F8;
  --line: #DAE0E6;
  --ink: #15212C;
  --ink-2: #4B5967;
  --ink-3: #66737F;
  --accent: #1D4E89;
  --accent-soft: #DCE7F4;
  --up: #0B7F58;
  --up-soft: #DDF1E8;
  --dn: #C0352B;
  --dn-soft: #F8E1DE;
  --c-th: #2A6CB6;
  --c-us: #7A5BC0;
  --c-fund: #17909F;
  --c-cash: #7B8794;
  --c-gold: #BC8F25;
  --c-btc: #D06A32;
  --proj: #B35C0A;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1218; --surface: #141B23; --surface-2: #1A232D; --line: #26313D;
    --ink: #E6ECF2; --ink-2: #A6B3C0; --ink-3: #8794A2;
    --accent: #6AA6E8; --accent-soft: #1B2C42;
    --up: #3CC693; --up-soft: #12302A; --dn: #FF7A6E; --dn-soft: #3A1E1D;
    --c-th: #5C9BE0; --c-us: #A28BE0; --c-fund: #45C0CF; --c-cash: #94A0AD; --c-gold: #E0B54D; --c-btc: #F08C55; --proj: #F2A24D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1218; --surface: #141B23; --surface-2: #1A232D; --line: #26313D;
  --ink: #E6ECF2; --ink-2: #A6B3C0; --ink-3: #8794A2;
  --accent: #6AA6E8; --accent-soft: #1B2C42;
  --up: #3CC693; --up-soft: #12302A; --dn: #FF7A6E; --dn-soft: #3A1E1D;
  --c-th: #5C9BE0; --c-us: #A28BE0; --c-fund: #45C0CF; --c-cash: #94A0AD; --c-gold: #E0B54D; --c-btc: #F08C55; --proj: #F2A24D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-block: 24px 40px;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.up { color: var(--up); } .dn { color: var(--dn); } .flat { color: var(--ink-2); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }

.btn.danger { border-color: var(--dn); color: var(--dn); }

.intro { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; max-width: 70ch; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .lab { font-size: 13px; color: var(--ink-2); }
.kpi .val { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; line-height: 1.2; letter-spacing: -0.02em; overflow-wrap: anywhere; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-family: var(--f-num); font-size: 13px; font-variant-numeric: tabular-nums; }

.legend i.dash { border-top: 2px dashed var(--ink-3); }
.legend i.dot { border-top: 3px dotted var(--proj); }
.tip { position: absolute; top: 8px; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 160px; z-index: 2; }
.tip .d { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; }
.ax { fill: var(--ink-3); font-size: 11px; font-family: var(--f-num); }
.axl { fill: var(--ink-2); font-size: 11px; font-family: var(--f-num); }
.empty-chart { padding: 48px 12px; text-align: center; color: var(--ink-3); font-size: 14px; }

.alloc { display: flex; flex-direction: column; gap: 14px; }
.donut { width: 100%; max-width: 220px; margin: 0 auto; display: block; }
.donut text { text-anchor: middle; fill: var(--ink); }
.al-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.al-list li { display: grid; grid-template-columns: 10px minmax(0,1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
.al-list .dot { width: 10px; height: 10px; border-radius: 3px; }
.al-list .pct { font-family: var(--f-num); color: var(--ink-2); font-size: 13px; min-width: 48px; text-align: right; }
.al-list .amt { font-family: var(--f-num); font-size: 13px; min-width: 84px; text-align: right; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }

.tbl-scroll { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 14px; }
th { text-align: right; font-weight: 500; font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th button { font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--ink); font-weight: 600; }
td { text-align: right; padding: 11px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }

.asset { display: flex; align-items: center; gap: 10px; white-space: normal; }
.asset .dot { width: 8px; height: 28px; border-radius: 3px; flex: none; }

.empty h2 { font-size: 18px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }

.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.field, select.field {

select.field { width: auto; min-width: 150px; max-width: 100%; }

.erows { display: flex; flex-direction: column; }
.ehead, .erow { display: grid; grid-template-columns: minmax(170px, 1.5fr) minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr); gap: 10px 12px; align-items: center; }
.ehead { font-size: 12px; color: var(--ink-2); padding: 0 0 8px; border-bottom: 1px solid var(--line); }

.erow .name { min-width: 0; }
.erow .f { min-width: 0; }

.blank-note { min-height: 22px; font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.mng { display: grid; grid-template-columns: minmax(90px, .6fr) minmax(0, 2fr) minmax(130px, .9fr) minmax(110px, .6fr) auto; gap: 8px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mng.mh { font-size: 12px; color: var(--ink-2); padding: 0 0 8px; }
.mng .f { min-width: 0; }
.mng.add { border-bottom: 0; padding-top: 14px; }
.sec-title { font-family: var(--f-display); font-weight: 600; font-size: 15px; margin: 18px 0 6px; }
details.how { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
details.how summary { cursor: pointer; color: var(--accent); }
details.how p { margin: 8px 0 0; }

@media (max-width: 720px) {
  .ehead { display: none; }
  .erow { grid-template-columns: minmax(0,1fr) minmax(0,1fr); padding: 12px 0; }
  .erow .name { grid-column: 1 / -1; }
  .cl { position: static; width: auto; height: auto; overflow: visible; clip: auto; display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 2px; white-space: normal; }
  .erow .calc { text-align: left; }
  .erow .calc .num { font-size: 15px; }
  .mng { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .mng.mh { display: none; }
  .mng .nm { grid-column: 1 / -1; }
  .mng .btn { justify-self: start; }

@media (max-width: 520px) { h1 { font-size: 24px; } }
</style>

  var HOW = '<details class="how"><summary>วิธีคิดมูลค่า</summary><p>ใส่ต้นทุนที่เติมเพิ่มในเดือนนั้น (ใส่ค่าติดลบถ้าถอนออก) และมูลค่าปัจจุบันของสินทรัพย์ ณ สิ้นเดือน ตามที่เห็นในแอปโบรกเกอร์หรือกองทุน ระบบคำนวณให้: กำไรเดือนนี้ = มูลค่าปัจจุบัน − (มูลค่าเดือนก่อน + ต้นทุนที่เติมเพิ่ม) และผลตอบแทน = กำไรเดือนนี้ ÷ (มูลค่าเดือนก่อน + ต้นทุนที่เติมเพิ่ม) ช่องมูลค่าที่เว้นว่างถือว่ามูลค่าเท่าเดิม ตัวเลขจางในช่องคือมูลค่าที่ระบบสมมติให้</p></details>';
  function noAssets() {
    return '<div class="empty"><p>ยังไม่มีสินทรัพย์ในพอร์ต เพิ่มสินทรัพย์แรกก่อน แล้วค่อยกรอกข้อมูลรายเดือน</p><button class="btn primary" data-act="sub" data-v="manage">เพิ่มสินทรัพย์</button></div>';
  }

  function monthBody(C) {
    if (!S.assets.length) return noAssets();
    var months = displayMonths(C);
    if (!selMonth || months.indexOf(selMonth) < 0) selMonth = C.endKey;
    var si = months.indexOf(selMonth), m = selMonth;
    var h = HOW + '<div class="ctrl"><button class="btn" data-act="prevM" aria-label="เดือนก่อนหน้า"' + (si <= 0 ? ' disabled' : '') + '>‹</button>' +
      '<select class="field" id="mSel" aria-label="เลือกเดือน">' + months.slice().reverse().map(function (k) { return '<option value="' + k + '"' + (k === m ? ' selected' : '') + '>' + mLong(k) + '</option>'; }).join('') + '</select>' +
      '<button class="btn" data-act="nextM" aria-label="เดือนถัดไป"' + (si >= months.length - 1 ? ' disabled' : '') + '>›</button>' +
      '<button class="btn" data-act="backMore">เพิ่มเดือนย้อนหลัง</button>' +
      '<button class="btn" data-act="copyPrev"' + (ro() ? ' disabled' : '') + '>คัดลอกต้นทุนจากเดือนก่อน</button><span class="note" id="copyNote"></span></div>';
    h += '<div class="erows">' + HEAD.replace('@@FIRST@@', 'สินทรัพย์');
    var mo = S.months[m] || {};
    S.assets.forEach(function (a) {
      var e = mo[a.id] || {};
      h += '<div class="erow">' + nameCell(a) +
        inp('c_' + a.id, a.id, m, 'c', e.c, '0', 'ต้นทุนที่ใส่เพิ่ม (฿)', (a.ticker || a.name) + ' ' + mLong(m)) +
        inp('v_' + a.id, a.id, m, 'v', e.v, '0', 'มูลค่าปัจจุบัน (฿)', (a.ticker || a.name) + ' ' + mLong(m)) +
        calcCell('ผลตอบแทนเดือนนี้', 'r', a.id, m) + calcCell('กำไร/ขาดทุนเดือนนี้', 'p', a.id, m) + '</div>';
    });
    h += '<div class="erow tot"><div class="name">รวมทุกสินทรัพย์</div>' +
      calcCell('ต้นทุนที่ใส่เพิ่มรวม', 'tc', '', m) + calcCell('มูลค่าปัจจุบันรวม', 'tv', '', m) +
      calcCell('ผลตอบแทนพอร์ต', 'tr', '', m) + calcCell('กำไร/ขาดทุนเดือนนี้', 'tp', '', m) + '</div></div>';
    h += '<p class="blank-note" id="blankNote"></p>';
    return h;
  }
  function assetBody(C) {
    if (!S.assets.length) return noAssets();
    if (!selAsset || !S.assets.some(function (a) { return a.id === selAsset; })) selAsset = S.assets[0].id;
    var a = S.assets.filter(function (x) { return x.id === selAsset; })[0];
    var months = displayMonths(C).slice().reverse();
    var h = HOW + '<div class="ctrl"><select class="field" id="aSel" aria-label="เลือกสินทรัพย์">' +
      S.assets.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === selAsset ? ' selected' : '') + '>' + esc((x.ticker ? x.ticker + ' · ' : '') + x.name) + '</option>'; }).join('') +
      '</select><label class="note" for="gIn">คาดการณ์เติบโต (%/ปี)</label><input class="field mi in" id="gIn" style="width:110px" inputmode="decimal" autocomplete="off" data-a="' + esc(a.id) + '" data-f="g" value="' + (typeof a.g === 'number' ? a.g : '') + '" placeholder="0" aria-label="คาดการณ์เติบโตต่อปี (%) ของ ' + esc(a.ticker || a.name) + '"' + (ro() ? ' disabled' : '') + '><span class="note">เรียงจากเดือนล่าสุดลงไป</span></div><div class="erows">' + HEAD.replace('@@FIRST@@', 'เดือน');
    months.forEach(function (k) {
      var e = (S.months[k] || {})[a.id] || {};
      h += '<div class="erow"><div class="name"><div class="t" style="font-weight:500">' + mLong(k) + '</div></div>' +
        inp('c_' + k, a.id, k, 'c', e.c, '0', 'ต้นทุนที่ใส่เพิ่ม (฿)', (a.ticker || a.name) + ' ' + mLong(k)) +
        inp('v_' + k, a.id, k, 'v', e.v, '0', 'มูลค่าปัจจุบัน (฿)', (a.ticker || a.name) + ' ' + mLong(k)) +
        calcCell('ผลตอบแทนเดือนนี้', 'r', a.id, k) + calcCell('กำไร/ขาดทุนเดือนนี้', 'p', a.id, k) + '</div>';
    });
    h += '</div><div class="ctrl" style="margin:14px 0 0"><button class="btn" data-act="backMore">เพิ่มเดือนย้อนหลัง 12 เดือน</button></div>';
    return h;
  }
  function manageBody() {
    var clsOpts = function (sel) { return Object.keys(CLASSES).map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + CLASSES[k].name + '</option>'; }).join(''); };
    var dis = ro() ? ' disabled' : '';
    var h = '<p class="intro">เพิ่ม แก้ไข หรือลบสินทรัพย์ที่คุณถือ และกรอก % เติบโตต่อปีที่คาดไว้ของแต่ละสินทรัพย์ เพื่อใช้คำนวณมูลค่าคาดการณ์ในหน้าภาพรวม (เว้นว่าง = 0%) การลบสินทรัพย์จะลบข้อมูลรายเดือนของสินทรัพย์นั้นไปด้วย</p>';
    if (S.assets.length) h += '<div class="mng mh"><span>ชื่อย่อ</span><span>ชื่อสินทรัพย์</span><span>ประเภท</span><span>คาดการณ์เติบโต (%/ปี)</span><span></span></div>';
    S.assets.forEach(function (a) {
      var key = 'del:' + a.id;
      h += '<div class="mng"><div class="f"><label class="cl" for="t_' + esc(a.id) + '">ชื่อย่อ</label><input class="field mi" id="t_' + esc(a.id) + '" data-a="' + esc(a.id) + '" data-f="ticker" value="' + esc(a.ticker || '') + '" placeholder="ชื่อย่อ" aria-label="ชื่อย่อ"' + dis + '></div>' +
        '<div class="f nm"><label class="cl" for="n_' + esc(a.id) + '">ชื่อสินทรัพย์</label><input class="field mi" id="n_' + esc(a.id) + '" data-a="' + esc(a.id) + '" data-f="name" value="' + esc(a.name) + '" placeholder="ชื่อสินทรัพย์" aria-label="ชื่อสินทรัพย์"' + dis + '></div>' +
        '<div class="f"><label class="cl" for="k_' + esc(a.id) + '">ประเภท</label><select class="field mc" id="k_' + esc(a.id) + '" data-a="' + esc(a.id) + '" aria-label="ประเภท"' + dis + '>' + clsOpts(a.cls) + '</select></div>' +
        '<div class="f"><label class="cl" for="g_' + esc(a.id) + '">คาดการณ์เติบโต (%/ปี)</label><input class="field mi in" id="g_' + esc(a.id) + '" inputmode="decimal" autocomplete="off" data-a="' + esc(a.id) + '" data-f="g" value="' + (typeof a.g === 'number' ? a.g : '') + '" placeholder="0" aria-label="คาดการณ์เติบโตต่อปี (%) ของ ' + esc(a.ticker || a.name) + '"' + dis + '></div>' +
        '<button class="btn danger sm' + (armed === key ? ' armed' : '') + '" data-act="delAsset" data-a="' + esc(a.id) + '"' + dis + '>' + (armed === key ? 'ยืนยันลบ' : 'ลบ') + '</button></div>';
    });
    h += '<div class="sec-title">เพิ่มสินทรัพย์ใหม่</div><div class="mng add"><div class="f"><label class="cl" for="nTick">ชื่อย่อ</label><input class="field" id="nTick" placeholder="ชื่อย่อ เช่น PTT" aria-label="ชื่อย่อสินทรัพย์ใหม่"' + dis + '></div>' +
      '<div class="f nm"><label class="cl" for="nName">ชื่อสินทรัพย์</label><input class="field" id="nName" placeholder="ชื่อสินทรัพย์" aria-label="ชื่อสินทรัพย์ใหม่"' + dis + '></div>' +
      '<div class="f"><label class="cl" for="nCls">ประเภท</label><select class="field" id="nCls" aria-label="ประเภทสินทรัพย์ใหม่"' + dis + '>' + clsOpts('th') + '</select></div>' +
      '<div class="f"><label class="cl" for="nG">คาดการณ์เติบโต (%/ปี)</label><input class="field in" id="nG" inputmode="decimal" autocomplete="off" placeholder="เช่น 8" aria-label="คาดการณ์เติบโตต่อปี (%) ของสินทรัพย์ใหม่"' + dis + '></div>' +
      '<button class="btn primary" data-act="addAsset"' + dis + '>เพิ่ม</button></div><p class="blank-note" id="addNote"></p>';
    var k2 = 'clearAll';
    h += '<div class="sec-title">ล้างข้อมูล</div><p class="intro">ลบสินทรัพย์และข้อมูลรายเดือนทั้งหมดเพื่อเริ่มใหม่ ย้อนกลับไม่ได้</p>' +
      (armed === k2 ? '<button class="btn danger armed" data-act="clearAll">ยืนยัน ลบข้อมูลทั้งหมด</button> <button class="btn" data-act="disarm">ยกเลิก</button>'
        : '<button class="btn danger" data-act="clearAll"' + dis + '>ล้างข้อมูลทั้งหมด</button>');
    return h;
  }
  function entryHTML(C) {
    var tabs = [['month', 'รายเดือน'], ['asset', 'รายสินทรัพย์'], ['manage', 'จัดการสินทรัพย์']];
    return '<section class="panel"><div class="panel-head"><h2>กรอกข้อมูลลงทุน</h2><div class="tabs" role="group" aria-label="รูปแบบการกรอก">' +
      tabs.map(function (t) { return '<button data-act="sub" data-v="' + t[0] + '" aria-pressed="' + (sub === t[0]) + '">' + t[1] + '</button>'; }).join('') +
      '</div></div><div id="entryBody">' + (sub === 'month' ? monthBody(C) : sub === 'asset' ? assetBody(C) : manageBody()) + '</div></section>';
  }
  function renderEntryBody() {
    var C = compute(), el = $('entryBody');
    if (!el) return;
    el.innerHTML = sub === 'month' ? monthBody(C) : sub === 'asset' ? assetBody(C) : manageBody();
    updateCalcs();
  }

  function updateCalcs() {
    var C = compute(), els = document.querySelectorAll('[data-calc]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i], t = el.dataset.calc, a = el.dataset.a, m = el.dataset.m, txt = '', c = '';
      if (t === 'r' || t === 'p') {
        var cell = cellOf(C, a, m);
        if (t === 'r') { var rr = cell.base > 0 ? (cell.pl / cell.base) * 100 : null; txt = rr === null ? '–' : spct(rr); c = rr === null ? 'flat' : cls(rr); }
        else { txt = sbaht(cell.pl); c = cls(cell.pl); }
      } else {
        var T = C.T[m] || ZT;
        if (t === 'tc') txt = bahtS(T.c);
        else if (t === 'tr') { txt = T.ret === null ? '–' : spct(T.ret); c = T.ret === null ? 'flat' : cls(T.ret); }
        else if (t === 'tv') txt = bahtS(T.V);
        else if (t === 'tp') { txt = sbaht(T.pl); c = cls(T.pl); }
      }
      el.textContent = txt; el.className = 'num ' + c;
    }
    var vin = document.querySelectorAll('input.in[data-f="v"]');
    for (var j = 0; j < vin.length; j++) { if (!vin[j].value) vin[j].placeholder = nf0.format(Math.round(cellOf(C, vin[j].dataset.a, vin[j].dataset.m).base)); }
    var bn = $('blankNote');
    if (bn) { var TT = C.T[selMonth] || ZT; bn.textContent = TT.blanks ? 'ยังไม่ได้กรอกมูลค่าปัจจุบัน ' + TT.blanks + ' รายการ ระบบนับว่ามูลค่าเท่าเดิมไปก่อน' : ''; }
  }

  /* ---------- วาดหน้า ---------- */
  function render() {
    var C = compute();
    renderChrome(C);
    view.innerHTML = page === 'overview' ? overviewHTML(C) : entryHTML(C);
    if (page === 'overview') drawCharts(); else updateCalcs();
  }
  function route() {
    var h = (location.hash || '#overview').slice(1);
    page = h === 'entry' ? 'entry' : 'overview';
    render();
  }
  window.addEventListener('hashchange', route);

  /* ---------- เหตุการณ์ ---------- */
  function arm(key) {
    armed = key; clearTimeout(armTimer);
    armTimer = setTimeout(function () { armed = null; render(); }, 5000);
  }
  function disarm() { armed = null; clearTimeout(armTimer); }

  view.addEventListener('input', function (e) {
    var el = e.target;
    if (el.classList.contains('mi') && el.dataset.f === 'g') {
      var ga = S.assets.filter(function (x) { return x.id === el.dataset.a; })[0];
      var gv = parseNum(el.value);
      if (gv === 'pending') { el.removeAttribute('aria-invalid'); return; }
      if (!ga || gv === undefined || (gv !== null && gv <= -100)) { el.setAttribute('aria-invalid', 'true'); return; }
      el.removeAttribute('aria-invalid');
      if (gv === null) delete ga.g; else ga.g = gv;
      persist();
    } else if (el.classList.contains('in')) {
      var raw = el.value, v = parseNum(raw), f = el.dataset.f;
      if (v === 'pending') { el.removeAttribute('aria-invalid'); return; }
      if (v === undefined || (f === 'v' && v !== null && v < 0)) { el.setAttribute('aria-invalid', 'true'); return; }
      el.removeAttribute('aria-invalid');
      setCell(el.dataset.a, el.dataset.m, f, v);
      persist(); updateCalcs();
    } else if (el.classList.contains('mi')) {
      var a = S.assets.filter(function (x) { return x.id === el.dataset.a; })[0];
      if (a) { a[el.dataset.f] = el.value; persist(); }
    }
  });
  function clampYears(v) { v = Math.round(+v); if (!isFinite(v)) v = 0; return Math.max(0, Math.min(50, v)); }
  view.addEventListener('input', function (e) {
    if (e.target.id !== 'projYears') return;
    var y = clampYears(e.target.value), nb = $('projNum');
    if (nb) nb.value = y;
    if (ov && y > 0) { projH = y * 12; ov.pr = project(ov.C, projH, projC); drawLine(); }
  });
  view.addEventListener('change', function (e) {
    if (e.target.id === 'retAsset') { retAsset = e.target.value; render(); var rf = $('retAsset'); if (rf && rf.focus) rf.focus(); return; }
    if (e.target.id === 'projYears' || e.target.id === 'projNum') {
      var id = e.target.id;
      projH = clampYears(e.target.value) * 12;
      render();
      var f = $(id); if (f && f.focus) f.focus();
      return;
    }
    var el = e.target;
    if (el.id === 'mSel') { selMonth = el.value; renderEntryBody(); }
    else if (el.id === 'aSel') { selAsset = el.value; renderEntryBody(); }
    else if (el.classList.contains('mc')) {
      var a = S.assets.filter(function (x) { return x.id === el.dataset.a; })[0];
      if (a) { a.cls = el.value; persist(); }
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, C, months, si;
    if (act === 'retry') { flush(); return; }
    if (act === 'share') { copyShareLink(); return; }
    if (act === 'disarm') { disarm(); render(); return; }
    if (act === 'range') { rangeN = +b.dataset.v; render(); }
    else if (act === 'filter') { filter = b.dataset.v; render(); }
    else if (act === 'proj') { projH = +b.dataset.v; render(); }
    else if (act === 'retrange') { retN = +b.dataset.v; render(); }
    else if (act === 'projc') { projC = b.dataset.v === '1'; render(); }
    else if (act === 'goManage') { sub = 'manage'; }
    else if (act === 'sort') { var k = b.dataset.k; if (sort.k === k) sort.dir = -sort.dir; else { sort.k = k; sort.dir = k === 't' ? 1 : -1; } render(); }
    else if (act === 'sub') { sub = b.dataset.v; if (page !== 'entry') { location.hash = '#entry'; } else render(); }
    else if (act === 'backMore') { backExtra += 12; renderEntryBody(); }
    else if (act === 'prevM' || act === 'nextM') {
      C = compute(); months = displayMonths(C); si = months.indexOf(selMonth || C.endKey);
      si += act === 'prevM' ? -1 : 1;
      if (si >= 0 && si < months.length) { selMonth = months[si]; renderEntryBody(); }
    }
    else if (act === 'copyPrev') {
      var prevK = idxKey(kIdx(selMonth) - 1), changed = false;
      S.assets.forEach(function (a) {
        var pe = (S.months[prevK] || {})[a.id], ce = (S.months[selMonth] || {})[a.id];
        if (pe && typeof pe.c === 'number' && !(ce && typeof ce.c === 'number')) { setCell(a.id, selMonth, 'c', pe.c); changed = true; }
      });
      if (changed) { persist(); renderEntryBody(); }
      else { var n = $('copyNote'); if (n) n.textContent = 'ไม่มีต้นทุนเดือนก่อนให้คัดลอก'; }
    }
    else if (act === 'addAsset') {
      var name = $('nName').value.trim(), tick = $('nTick').value.trim();
      if (!name && !tick) { $('addNote').textContent = 'ใส่ชื่อหรือชื่อย่อของสินทรัพย์ก่อน'; return; }
      var id = 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
      var gv = parseNum($('nG').value);
      if (gv === undefined || gv === 'pending' || (gv !== null && gv <= -100)) { $('addNote').textContent = 'ใส่ % เติบโตเป็นตัวเลข เช่น 8 หรือ -2'; return; }
      var na = { id: id, name: name || tick, ticker: tick, cls: $('nCls').value };
      if (gv !== null) na.g = gv;
      S.assets.push(na);
      selAsset = selAsset || id;
      persist(); renderEntryBody();
    }
    else if (act === 'delAsset') {
      var key = 'del:' + b.dataset.a;
      if (armed !== key) { arm(key); renderEntryBody(); return; }
      var aid = b.dataset.a;
      S.assets = S.assets.filter(function (x) { return x.id !== aid; });
      Object.keys(S.months).forEach(function (mk) { delete S.months[mk][aid]; if (!Object.keys(S.months[mk]).length) delete S.months[mk]; });
      if (selAsset === aid) selAsset = null;
      disarm(); persist(); renderEntryBody();
    }
    else if (act === 'clearAll' || act === 'clearSample') {
      if (armed !== act) { arm(act); render(); return; }
      disarm();
      S = { v: 1, sample: false, assets: [], months: {} };
      selMonth = null; selAsset = null; backExtra = 0; sub = 'manage';
      persist();
      if (location.hash !== '#entry') location.hash = '#entry'; else render();
      if (act === 'clearSample') render();
    }
  });

  if (window.ResizeObserver) {
    var lastW = view.clientWidth;
    new ResizeObserver(function () { if (view.clientWidth !== lastW) { lastW = view.clientWidth; drawCharts(); } }).observe(view);
  } else window.addEventListener('resize', drawCharts);

  setStatus('loading');
  page = (location.hash || '').slice(1) === 'entry' ? 'entry' : 'overview';
  initAuth();
  init();
})();
</script>


<style>
/* ---------- พื้นหลังรูปครอบครัว ---------- */
.rsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 0 0 12px; }
.rstat { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; min-width: 0; }
.rstat .num { font-size: 18px; font-weight: 500; }
.projctl { display: inline-flex; align-items: center; gap: 8px; }

.music { display: inline-flex; align-items: center; gap: 8px; }
.music input[type=range] { width: 84px; accent-color: var(--accent); }
.music .cl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<script>
/* ---------- เพลงประกอบ ---------- */
(function () {
  var btn = document.getElementById('musicBtn'), vol = document.getElementById('musicVol');
  if (!btn || !vol) return;
  var on = false, mode = null, audio = null, ctx = null, master = null, timer = null, nextT = 0, step = 0;
  // ถ้าวางไฟล์ music.mp3 ไว้ข้าง index.html จะเล่นไฟล์นั้น ไม่เช่นนั้นเล่นทำนองสั้นที่สร้างในหน้าเว็บ
  var BPM = 84, SPB = 60 / BPM / 2; // เขบ็ตหนึ่งชั้น
  var CH = [
    { bass: 130.81, notes: [261.63, 329.63, 392.0, 523.25] },  // C
    { bass: 98.0,   notes: [246.94, 293.66, 392.0, 493.88] },  // G
    { bass: 110.0,  notes: [261.63, 329.63, 440.0, 523.25] },  // Am
    { bass: 87.31,  notes: [261.63, 349.23, 440.0, 523.25] }   // F
  ];
  var ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  var MEL = [[0, 2], [4, 3], [8, 3], [12, 2], [16, 3], [20, 1], [24, 2], [28, 3]]; // [ตำแหน่ง, ลำดับโน้ตในคอร์ด] ทำนองไล่ขึ้นเบาๆ
  function tone(freq, t, dur, type, gain) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule() {
    while (nextT < ctx.currentTime + 0.4) {
      var bar = Math.floor(step / 8) % 4, pos = step % 8, ch = CH[bar];
      tone(ch.notes[ARP[pos]], nextT, SPB * 1.8, 'triangle', 0.16);
      if (pos === 0) { tone(ch.bass, nextT, SPB * 7.5, 'sine', 0.3); tone(ch.notes[0] * 2, nextT, SPB * 7, 'sine', 0.05); }
      if (pos === 4) tone(ch.bass * 2, nextT, SPB * 3, 'sine', 0.12);
      var phrase = step % 32;
      for (var i = 0; i < MEL.length; i++) if (MEL[i][0] === phrase) tone(ch.notes[MEL[i][1]] * 2, nextT, SPB * 3.5, 'sine', 0.13);
      nextT += SPB; step++;
    }
  }
  function startSynth() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = 'เบราว์เซอร์นี้เล่นเพลงไม่ได้'; btn.disabled = true; return; }
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    master.gain.value = vol.value / 100;
    ctx.resume(); mode = 'synth'; nextT = ctx.currentTime + 0.1; step = 0;
    clearInterval(timer); timer = setInterval(schedule, 120); schedule();
  }
  function start() {
    on = true; btn.textContent = 'ปิดเพลง'; btn.setAttribute('aria-pressed', 'true');
    audio = new Audio('music.mp3'); audio.loop = true; audio.volume = vol.value / 100;
    audio.addEventListener('error', function () { if (on && mode !== 'synth') startSynth(); });
    var p = audio.play();
    mode = 'file';
    if (p && p.catch) p.catch(function () { if (on && mode !== 'synth') startSynth(); });
  }
  function stop() {
    on = false; btn.textContent = 'เปิดเพลง'; btn.setAttribute('aria-pressed', 'false');
    if (audio) { audio.pause(); audio = null; }
    clearInterval(timer); timer = null;
    if (ctx) ctx.suspend();
    mode = null;
  }
  btn.addEventListener('click', function () { if (on) stop(); else start(); });
  vol.addEventListener('input', function () {
    var v = vol.value / 100;
    if (audio) audio.volume = v;
    if (master) master.gain.value = v;
  });
})();
</script>
